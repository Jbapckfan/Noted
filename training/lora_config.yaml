# mlx_lm.lora config for the NotedCore note/extraction adapter.
# Runs on a Mac with Apple Silicon (Metal). The BASE must be the model that ships on the phone,
# because the adapter is bound to it at inference.
#
# Default base is the phone-safe 3B; for higher quality on an 8GB iPhone 16 Pro Max, try the 7B
# (uncomment) and re-run the on-device benchmark before committing to it.
model: "mlx-community/Llama-3.2-3B-Instruct-4bit"
# model: "mlx-community/Qwen2.5-7B-Instruct-4bit"

train: true
data: "training/data"          # expects train.jsonl + valid.jsonl (chat format) — produced by convert.py
adapter_path: "training/adapters/note"

# LoRA hyperparameters (start conservative; watch valid loss)
fine_tune_type: lora
num_layers: 16
batch_size: 2
iters: 1200
learning_rate: 1.0e-5
steps_per_report: 25
steps_per_eval: 200
save_every: 200
max_seq_length: 4096
grad_checkpoint: true

lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.0
